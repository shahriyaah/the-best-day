<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shahriya & Afrida</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body { 
    font-family: 'Montserrat', sans-serif; 
    color: #333;
    overflow-x: hidden;
    background: #E6E0F8;
  }

  /* Fluid animated background */
  .bg {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: -1;
    background: linear-gradient(135deg, #E6E0F8, #F8EDEB, #B5838D);
    background-size: 400% 400%;
    animation: gradientShift 15s ease infinite;
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
  }

  .glass {
    background: rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(12px);
    border-radius: 20px;
    padding: 60px 40px;
    border: 1px solid rgba(255, 255, 255, 0.3);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    animation: fadeIn 1.5s ease-out;
    max-width: 900px;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: 3.5rem;
    color: #B5838D;
    margin-bottom: 10px;
    animation: float 4s ease-in-out infinite;
  }

  .subtext {
    font-size: 1.2rem;
    color: #555;
    font-weight: 300;
    margin-bottom: 40px;
  }

  .counter {
    display: flex;
    gap: 25px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 40px;
  }

  .time-box {
    background: rgba(255, 255, 255, 0.3);
    padding: 20px 25px;
    border-radius: 15px;
    min-width: 110px;
    transition: transform 0.3s ease;
  }

  .time-box:hover {
    transform: translateY(-5px);
  }

  .time-box .num {
    font-size: 2.8rem;
    font-weight: 500;
    color: #B5838D;
    font-family: 'Playfair Display', serif;
  }

  .time-box .label {
    font-size: 0.85rem;
    color: #666;
    margin-top: 5px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
  }

  .message {
    font-size: 1.1rem;
    color: #555;
    max-width: 600px;
    margin: 0 auto;
    line-height: 1.8;
  }

  footer {
    text-align: center;
    padding: 30px 20px;
    color: #B5838D;
    font-size: 0.9rem;
  }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

  @media (max-width: 768px) {
    h1 { font-size: 2.5rem; }
    .glass { padding: 40px 25px; }
    .counter { gap: 15px; }
    .time-box { min-width: 80px; padding: 15px 18px; }
    .time-box .num { font-size: 2rem; }
  }
</style>
</head>
<body>
<div class="bg"></div>

<section class="hero">
  <div class="glass">
    <h1>Shahriya & Afrida</h1>
    <p class="subtext">Since 27 September 2025 • Alhamdulillah for the day I met you</p>
    
    <div class="counter">
      <div class="time-box">
        <div class="num" id="years">0</div>
        <div class="label">Years</div>
      </div>
      <div class="time-box">
        <div class="num" id="days">0</div>
        <div class="label">Days</div>
      </div>
      <div class="time-box">
        <div class="num" id="hours">0</div>
        <div class="label">Hours</div>
      </div>
      <div class="time-box">
        <div class="num" id="minutes">0</div>
        <div class="label">Minutes</div>
      </div>
      <div class="time-box">
        <div class="num" id="seconds">0</div>
        <div class="label">Seconds</div>
      </div>
    </div>

    <p class="message">
      Every second since that day has been a blessing. 
      Thank you for saying yes, Afrida.
    </p>
  </div>
</section>

<footer>Thanks For visiting</footer>

<script>
  const startDate = new Date("2025-09-27T00:00:00").getTime();
  
  function updateCounter() {
    const now = new Date().getTime();
    const diff = now - startDate;
    
    const years = Math.floor(diff / (1000 * 60 * 60 * 24 * 365.25));
    const days = Math.floor((diff % (1000 * 60 * 60 * 24 * 365.25)) / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((diff % (1000 * 60)) / 1000);
    
    document.getElementById("years").textContent = years;
    document.getElementById("days").textContent = days;
    document.getElementById("hours").textContent = hours;
    document.getElementById("minutes").textContent = minutes;
    document.getElementById("seconds").textContent = seconds;
  }
  
  updateCounter();
  setInterval(updateCounter, 1000);
</script>

</body>
</html>
